name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Cancel previous runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history for better coverage reporting
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          # Ensure tests run in CI mode
          CI: true

      - name: Archive coverage artifacts
        if: matrix.node-version == 20 # Only archive once
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            !coverage/tmp/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && matrix.node-version == 20
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./coverage/lcov.info
          delete-old-comments: true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check build size
        run: |
          echo "Build completed successfully!"
          echo "Build size:"
          du -sh dist/

          # Optional: fail if build is too large
          # MAX_SIZE=10M
          # ACTUAL_SIZE=$(du -sm dist/ | cut -f1)
          # if [ $ACTUAL_SIZE -gt 10 ]; then
          #   echo "Build size ${ACTUAL_SIZE}M exceeds maximum ${MAX_SIZE}"
          #   exit 1
          # fi

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Check for known vulnerabilities
        run: |
          # Run audit and capture output
          if ! npm audit --audit-level=moderate --json > audit-results.json; then
            echo "Security vulnerabilities found!"
            cat audit-results.json
            # Don't fail the build for now, just warn
            echo "::warning::Security vulnerabilities detected. Please review."
          else
            echo "No security vulnerabilities found."
          fi
